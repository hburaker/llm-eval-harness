name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests && ruff format --check src tests

      - name: Unit tests
        run: python -m pytest

      - name: Validate golden dataset
        run: python -m eval_harness validate

      - name: Baseline eval + regression gate
        run: python -m eval_harness run --target baseline --no-judge --gate baselines/baseline.json --run-name ci-baseline

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/ci-baseline.*
